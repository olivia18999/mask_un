<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Scanner (Every 3 Seconds)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 600; }
        .subtitle { font-size: 0.9rem; color: #6B7280; margin-bottom: 25px; }

        .btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-start:hover { background-color: var(--primary-hover); }

        #webcam-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 25px auto;
            border-radius: 15px;
            overflow: hidden;
            background: #E5E7EB;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #FFF;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* บังคับให้วิดีโอจากเว็บแคมขยายเต็มกรอบ */
        #webcam-container video, #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .placeholder-text {
            color: #6B7280;
            font-size: 0.9rem;
            position: absolute;
            padding: 0 10px;
        }

        #label-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .predict-item {
            background: #F9FAFB;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 4px solid #E5E7EB;
        }

        .predict-item.active {
            border-left-color: var(--primary);
            background: #EEF2FF;
        }

        .predict-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .progress-bar-bg { background: #E5E7EB; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.2s; }
        #status-indicator { margin-top: 15px; font-size: 0.8rem; color: #9CA3AF; min-height: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Teachable Machine AI</h1>
        <p class="subtitle">วิเคราะห์ภาพอัตโนมัติอัปเดตทุกๆ 3 วินาที</p>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">เปิดใช้งานระบบ</button>
        
        <div id="webcam-wrapper">
            <div class="placeholder-text" id="placeholder">กรุณากดปุ่มเปิดใช้งานและอนุญาตให้เข้าถึงกล้อง</div>
            <div id="webcam-container"></div>
        </div>
        
        <div id="label-container"></div>
        <div id="status-indicator"></div>
    </div>

    <!-- โหลดสคริปต์หลัก -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hllJv-A0H/";[cite: 1]
        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const startBtn = document.getElementById("start-btn");
            const placeholder = document.getElementById("placeholder");
            
            try {
                startBtn.style.display = "none";
                placeholder.innerText = "กำลังโหลด AI และเรียกใช้งานกล้อง...";

                // 1. โหลดโมเดล AI
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");[cite: 1]
                maxPredictions = model.getTotalClasses();[cite: 1]

                // 2. ตั้งค่าและเปิดใช้งานกล้องเว็บบลูแคม (ปรับพารามิเตอร์ระบุขนาดเผื่อไว้สำหรับอุปกรณ์บางรุ่น)
                webcam = new tmImage.Webcam(250, 250, true);[cite: 1]
                
                // สั่งขอกล้องจากเบราว์เซอร์
                await webcam.setup({ facingMode: "user" });[cite: 1]
                await webcam.play();[cite: 1]
                
                // 3. ซ่อน Placeholder และแนบหน้าจอเข้ากับ HTML
                placeholder.style.display = "none";
                const webcamContainer = document.getElementById("webcam-container");
                webcamContainer.innerHTML = "";
                webcamContainer.appendChild(webcam.canvas);[cite: 1]

                // ในเวอร์ชันใหม่ บางครั้งกล้องต้องการ Element วิดีโอจริงในการแสดงผลร่วมด้วย
                if (webcam.video) {
                    webcam.video.setAttribute('playsinline', true);
                    webcam.video.setAttribute('muted', true);
                }

                // 4. สร้าง UI แสดงผลลัพธ์ข้อมูลเปอร์เซ็นต์
                labelContainer = document.getElementById("label-container");[cite: 1]
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {[cite: 1]
                    const item = document.createElement("div");
                    item.className = "predict-item";
                    item.id = `class-row-${i}`;
                    item.innerHTML = `
                        <div class="predict-info">
                            <span class="class-name">กำลังประมวลผล...</span>
                            <span class="class-percent">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="bar-${i}"></div>
                        </div>
                    `;
                    labelContainer.appendChild(item);[cite: 1]
                }

                // 5. เริ่มลูปวิดีโอ (อัปเดตเฟรมภาพอย่างต่อเนื่อง)
                window.requestAnimationFrame(loop);

                // 6. เริ่มต้นวงรอบทำงานทายผลทุกๆ 3 วินาที
                runPredictSchedule();

            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการเปิดระบบ:", error);
                placeholder.innerText = "❌ ไม่สามารถเข้าถึงกล้องได้\nกรุณาใช้โปรโตคอล https:// หรือรันผ่าน Local Server";
                placeholder.style.color = "#EF4444";
                startBtn.style.display = "block";
                startBtn.innerText = "ลองใหม่อีกครั้ง";
            }
        }

        async function loop() {
            if (webcam && webcam.canvas) {
                webcam.update();[cite: 1]
            }
            window.requestAnimationFrame(loop);
        }

        // ฟังก์ชันสั่งทำนายผลแบบหน่วงเวลารอบต่อรอบ (ปลอดภัยและเสถียรกว่าการใช้ setInterval ซ้อนกัน)
        async function runPredictSchedule() {
            try {
                await predict();
                triggerStatusEffect();
            } catch (err) {
                console.error("ทำนายผลผิดพลาด:", err);
            }
            // วนทำงานซ้ำอีกครั้งในอีก 3 วินาทีข้างหน้า
            setTimeout(runPredictSchedule, 3000);
        }

        async function predict() {
            if (!model || !webcam) return;
            
            const prediction = await model.predict(webcam.canvas);[cite: 1]
            
            for (let i = 0; i < maxPredictions; i++) {[cite: 1]
                const className = prediction[i].className;[cite: 1]
                const probability = prediction[i].probability;[cite: 1]
                const percentage = (probability * 100).toFixed(0);
                
                const row = document.getElementById(`class-row-${i}`);
                const bar = document.getElementById(`bar-${i}`);
                
                if (row && bar) {
                    row.querySelector('.class-name').innerText = className;
                    row.querySelector('.class-percent').innerText = percentage + "%";
                    bar.style.width = percentage + "%";
                    
                    if (probability > 0.5) {
                        row.classList.add('active');
                    } else {
                        row.classList.remove('active');
                    }
                }
            }
        }

        function triggerStatusEffect() {
            const statusEl = document.getElementById("status-indicator");
            statusEl.innerText = "⏳ กำลังรอประมวลผลรอบถัดไป...";
            statusEl.style.color = "#9CA3AF";
            
            setTimeout(() => {
                statusEl.innerText = "⚡ อัปเดตผล AI สำเร็จ";
                statusEl.style.color = "#10B981";
            }, 300);
        }
    </script>
</body>
</html>
