<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine AI Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        .btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-start:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        #webcam-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 25px auto;
            border-radius: 15px;
            overflow: hidden;
            background: #E5E7EB;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #FFF;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        .placeholder-text {
            color: var(--text-light);
            font-size: 0.9rem;
            position: absolute;
        }

        #label-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .predict-item {
            background: #F9FAFB;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 4px solid #E5E7EB;
            transition: all 0.3s ease;
        }

        .predict-item.active {
            border-left-color: var(--primary);
            background: #EEF2FF;
        }

        .predict-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .progress-bar-bg {
            background: #E5E7EB;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        #status-indicator {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: bold;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Teachable Machine AI</h1>
        <p class="subtitle">วิเคราะห์ภาพอัตโนมัติอัปเดตทุกๆ 3 วินาที</p>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">เปิดใช้งานระบบ</button>
        
        <div id="webcam-wrapper">
            <div class="placeholder-text" id="placeholder">ระบบยังไม่เริ่มทำงาน</div>
            <div id="webcam-container"></div>
        </div>
        
        <div id="label-container">
            <!-- รายการ Class และแถบเปอร์เซ็นต์จะถูกสร้างขึ้นอัตโนมัติที่นี่เมื่อเปิดโปรแกรม -->
        </div>

        <div id="status-indicator"></div>
    </div>

    <!-- ลิงก์ Library หลักจากต้นฉบับ -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // ลิงก์โมเดลจากต้นฉบับของคุณ
        const URL = "https://teachablemachine.withgoogle.com/models/hllJv-A0H/";[cite: 1]
        let model, webcam, labelContainer, maxPredictions;
        let isModelLoaded = false;

        async function init() {
            try {
                document.getElementById("start-btn").style.display = "none";
                document.getElementById("placeholder").innerText = "กำลังโหลดโมเดลและเปิดกล้อง...";

                const modelURL = URL + "model.json";[cite: 1]
                const metadataURL = URL + "metadata.json";[cite: 1]

                // โหลดโมเดล
                model = await tmImage.load(modelURL, metadataURL);[cite: 1]
                maxPredictions = model.getTotalClasses();[cite: 1]

                // ตั้งค่าเว็บบลูแคม
                const flip = true; 
                webcam = new tmImage.Webcam(250, 250, flip);[cite: 1]
                await webcam.setup();[cite: 1]
                await webcam.play();[cite: 1]
                
                // เริ่มลูปแสดงวิดีโอจากกล้อง (ให้กล้องเคลื่อนไหวลื่นไหลตลอดเวลา)
                window.requestAnimationFrame(loop);

                // ซ่อนข้อความแจ้งเตือนและส่งภาพเข้า Container
                document.getElementById("placeholder").style.display = "none";
                document.getElementById("webcam-container").appendChild(webcam.canvas);[cite: 1]
                
                labelContainer = document.getElementById("label-container");[cite: 1]
                labelContainer.innerHTML = ""; // ล้างค่าเก่า

                // สร้าง UI แถบวัดเปอร์เซ็นต์แบบไดนามิกตามจำนวนคลาสที่มีในโมเดล
                for (let i = 0; i < maxPredictions; i++) {[cite: 1]
                    const item = document.createElement("div");
                    item.className = "predict-item";
                    item.id = `class-row-${i}`;
                    item.innerHTML = `
                        <div class="predict-info">
                            <span class="class-name">กำลังโหลด...</span>
                            <span class="class-percent">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="bar-${i}"></div>
                        </div>
                    `;
                    labelContainer.appendChild(item);[cite: 1]
                }

                // เรียกทำนายครั้งแรกทันที
                await predict();

                // สั่งให้ทำนายผลซ้ำ "ทุกๆ 3 วินาที" (3000ms)
                setInterval(async () => {
                    await predict();
                    triggerStatusEffect();
                }, 3000);

            } catch (error) {
                console.error(error);
                alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้ กรุณาตรวจสอบสิทธิ์การเข้าถึงกล้อง หรือรันไฟล์ผ่านเซิร์ฟเวอร์จำลอง (Local Server)");
                document.getElementById("start-btn").style.display = "block";
                document.getElementById("placeholder").innerText = "เกิดข้อผิดพลาดในการติดตั้ง";
            }
        }

        async function loop() {
            webcam.update();[cite: 1]
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model || !webcam) return;
            
            const prediction = await model.predict(webcam.canvas);[cite: 1]
            
            for (let i = 0; i < maxPredictions; i++) {[cite: 1]
                const className = prediction[i].className;[cite: 1]
                const probability = prediction[i].probability; // ค่าระบุความน่าจะเป็น 0 - 1[cite: 1]
                const percentage = (probability * 100).toFixed(0); // แปลงเป็นเปอร์เซ็นต์เลขกลมๆ
                
                const row = document.getElementById(`class-row-${i}`);
                const bar = document.getElementById(`bar-${i}`);
                
                if (row && bar) {
                    // อัปเดตข้อความและเปอร์เซ็นต์
                    row.querySelector('.class-name').innerText = className;
                    row.querySelector('.class-percent').innerText = percentage + "%";
                    bar.style.width = percentage + "%";
                    
                    // ไฮไลต์แถวที่ความมั่นใจสูงเกิน 50% ให้เด่นขึ้นมา
                    if (probability > 0.5) {
                        row.classList.add('active');
                    } else {
                        row.classList.remove('active');
                    }
                }
            }
        }

        function triggerStatusEffect() {
            const statusEl = document.getElementById("status-indicator");
            statusEl.innerText = "⏳ กำลังประมวลผลรอบถัดไป...";
            statusEl.style.color = "#9CA3AF";
            
            setTimeout(() => {
                statusEl.innerText = "⚡ อัปเดตผลลัพธ์แล้ว";
                statusEl.style.color = "#10B981";
            }, 400);
        }
    </script>
</body>
</html>
