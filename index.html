<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --background: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .btn-start:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-start:active {
            transform: translateY(1px);
        }

        #webcam-container {
            margin: 1.5rem auto;
            border-radius: 12px;
            overflow: hidden;
            width: 250px;
            height: 250px;
            background-color: #E5E7EB;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #E5E7EB;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #label-container {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
        }

        .prediction-row {
            background-color: #F9FAFB;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .prediction-row .class-name {
            color: var(--text-main);
        }

        .prediction-row .probability {
            color: var(--primary);
            font-weight: 600;
        }

        /* สถานะกำลังนับถอยหลังตรวจจับ */
        .timer-badge {
            font-size: 0.8rem;
            color: #9CA3AF;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Teachable Machine</h1>
        <p class="subtitle">ระบบวิเคราะห์รูปภาพผ่านกล้อง WebCam</p>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">เปิดใช้งานกล้อง</button>
        
        <div id="webcam-container">
            <!-- กล้องจะแสดงที่นี่ -->
            <span style="color: #9CA3AF; font-size: 0.9rem;">ยังไม่ได้เปิดกล้อง</span>
        </div>
        
        <div id="label-container">
            <!-- ผลลัพธ์จะแสดงที่นี่ -->
        </div>
        <div class="timer-badge" id="timer-status"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hllJv-A0H/";
        let model, webcam, labelContainer, maxPredictions;
        let predictInterval;

        async function init() {
            // ซ่อนปุ่มเปิดกล้องหลังจากกด เพื่อป้องกันการกดซ้ำ
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("webcam-container").innerHTML = ""; 

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            // ปรับขนาดกล้องให้แสดงผลเต็มพื้นที่การ์ดสวยงามขึ้น (250x250)
            webcam = new tmImage.Webcam(250, 250, flip); 
            await webcam.setup(); 
            await webcam.play();
            
            // ใช้สำหรับอัปเดตเฟรมภาพของกล้องให้เคลื่อนไหวลื่นไหลตลอดเวลา
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            
            // สร้างโครงสร้างแถวแสดงผลลัพธ์ล่วงหน้าเพื่อให้ CSS จัดการได้สวยงาม
            for (let i = 0; i < maxPredictions; i++) { 
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `<span class="class-name">-</span><span class="probability">0.00%</span>`;
                labelContainer.appendChild(row);
            }

            // สั่งทำนายผลครั้งแรกทันทีที่เปิดกล้อง
            await predict();

            // ตั้งเวลาให้ฟังก์ชัน predict ทำงานซ้ำทุกๆ 3000 มิลลิวินาที (3 วินาที) แทน loop เดิม
            predictInterval = setInterval(async () => {
                await predict();
                flashStatus();
            }, 3000);
        }

        async function loop() {
            webcam.update(); // อัปเดตภาพจากกล้องให้เคลื่อนไหวตลอดเวลา
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                // แปลงทศนิยมเป็นเปอร์เซ็นต์เพื่อให้ผู้ใช้เข้าใจง่ายขึ้น (เช่น 0.95 -> 95.00%)
                const probability = (prediction[i].probability * 100).toFixed(2) + "%";
                
                const row = labelContainer.childNodes[i];
                row.querySelector('.class-name').innerText = className;
                row.querySelector('.probability').innerText = probability;
            }
        }

        // เอฟเฟกต์แสดงสถานะเมื่อเกิดการสแกนทุก 3 วินาที
        function flashStatus() {
            const statusText = document.getElementById("timer-status");
            statusText.innerText = "✓ อัปเดตผลการวิเคราะห์แล้ว";
            setTimeout(() => {
                statusText.innerText = "กำลังรอรอบถัดไป (ทุกๆ 3 วินาที)...";
            }, 1000);
        }
    </script>
</body>
</html>
