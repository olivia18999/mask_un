<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Scanner (Native WebRTC Version)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 600; }
        .subtitle { font-size: 0.9rem; color: #6B7280; margin-bottom: 25px; }

        .btn-start {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-start:hover { background-color: var(--primary-hover); }

        #webcam-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 25px auto;
            border-radius: 15px;
            overflow: hidden;
            background: #E5E7EB;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #FFF;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* ใช้แท็กวิดีโอมาตรฐานเพื่อให้เบราว์เซอร์เปิดกล้องได้เสถียรที่สุด */
        #native-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* ส่องกระจกเงาเหมือนกล้องหน้าทั่วไป */
            display: none;
        }

        .placeholder-text {
            color: #6B7280;
            font-size: 0.9rem;
            position: absolute;
            padding: 0 10px;
            z-index: 10;
        }

        #label-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .predict-item {
            background: #F9FAFB;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 4px solid #E5E7EB;
        }

        .predict-item.active {
            border-left-color: var(--primary);
            background: #EEF2FF;
        }

        .predict-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .progress-bar-bg { background: #E5E7EB; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.2s; }
        #status-indicator { margin-top: 15px; font-size: 0.8rem; color: #9CA3AF; min-height: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Teachable Machine AI</h1>
        <p class="subtitle">วิเคราะห์ภาพอัตโนมัติอัปเดตทุกๆ 3 วินาที</p>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">เปิดใช้งานระบบ</button>
        
        <div id="webcam-wrapper">
            <div class="placeholder-text" id="placeholder">กรุณากดปุ่มเปิดใช้งานและอนุญาตให้เข้าถึงกล้อง</div>
            <!-- ใช้ Native HTML5 Video element แทนกล้องจำลองของสคริปต์เก่า -->
            <video id="native-video" autoplay playsinline muted></video>
        </div>
        
        <div id="label-container"></div>
        <div id="status-indicator"></div>
    </div>

    <!-- โหลดสคริปต์หลักหลักจาก Google -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hllJv-A0H/";
        let model, maxPredictions, labelContainer;
        let videoElement = document.getElementById("native-video");
        let localStream = null;

        async function init() {
            const startBtn = document.getElementById("start-btn");
            const placeholder = document.getElementById("placeholder");
            
            try {
                startBtn.style.display = "none";
                placeholder.innerText = "กำลังโหลด AI และเรียกใช้งานกล้อง...";

                // 1. โหลดโมเดล AI ของ Teachable Machine
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                // 2. เรียกเปิดกล้องผ่านมาตรฐาน WebRTC API ของเบราว์เซอร์โดยตรง (แก้ไขปัญหากล้องไม่ขึ้น)
                const constraints = {
                    video: {
                        width: { ideal: 400 },
                        height: { ideal: 400 },
                        facingMode: "user"
                    },
                    audio: false
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = localStream;
                videoElement.style.display = "block";
                placeholder.style.display = "none";

                // 3. สร้าง UI แสดงแถบวัดเปอร์เซ็นต์ตามคลาสที่มีในโมเดล
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const item = document.createElement("div");
                    item.className = "predict-item";
                    item.id = `class-row-${i}`;
                    item.innerHTML = `
                        <div class="predict-info">
                            <span class="class-name">กำลังประมวลผล...</span>
                            <span class="class-percent">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="bar-${i}"></div>
                        </div>
                    `;
                    labelContainer.appendChild(item);
                }

                // 4. สั่งเริ่มทำนายผลลัพธ์รอบแรกทันที และตั้งรอบเวลาสแกนใหม่ทุก 3 วินาที
                runPredictSchedule();

            } catch (error) {
                console.error("เกิดข้อผิดพลาดรุนแรง:", error);
                placeholder.innerText = "❌ ไม่สามารถเข้าถึงกล้องได้\n\nเหตุผล: บราวเซอร์ต้องการความปลอดภัยระดับ HTTPS หรือทดสอบผ่านเว็บเซิร์ฟเวอร์จำลอง (Localhost) เท่านั้น";
                placeholder.style.color = "#EF4444";
                startBtn.style.display = "block";
                startBtn.innerText = "ลองใหม่อีกครั้ง";
            }
        }

        // ฟังก์ชันหน่วงเวลารันทำนายผลอย่างปลอดภัยรอบต่อรอบทุกๆ 3 วินาที
        async function runPredictSchedule() {
            if (localStream && videoElement.readyState >= 3) {
                try {
                    await predict();
                    triggerStatusEffect();
                } catch (err) {
                    console.error("ทำนายผลผิดพลาด:", err);
                }
            }
            // เรียกฟังก์ชันตัวเองซ้ำในอีก 3 วินาทีข้างหน้า
            setTimeout(runPredictSchedule, 3000);
        }

        async function predict() {
            if (!model || !videoElement) return;
            
            // ส่งค่าอิลิเมนต์ <video> ตรงๆ เข้าไปประมวลผลใน AI ของ Teachable Machine
            const prediction = await model.predict(videoElement);
            
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                const percentage = (probability * 100).toFixed(0);
                
                const row = document.getElementById(`class-row-${i}`);
                const bar = document.getElementById(`bar-${i}`);
                
                if (row && bar) {
                    row.querySelector('.class-name').innerText = className;
                    row.querySelector('.class-percent').innerText = percentage + "%";
                    bar.style.width = percentage + "%";
                    
                    // หากความมั่นใจเกิน 50% ให้ไฮไลต์แถวให้สว่างขึ้น
                    if (probability > 0.5) {
                        row.classList.add('active');
                    } else {
                        row.classList.remove('active');
                    }
                }
            }
        }

        function triggerStatusEffect() {
            const statusEl = document.getElementById("status-indicator");
            statusEl.innerText = "⏳ กำลังรอประมวลผลรอบถัดไป...";
            statusEl.style.color = "#9CA3AF";
            
            setTimeout(() => {
                statusEl.innerText = "⚡ อัปเดตผล AI สำเร็จ";
                statusEl.style.color = "#10B981";
            }, 300);
        }
    </script>
</body>
</html>
